name: CoffeeTaster
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  CoffeeKit:
    path: CoffeeKit
targets:
  CoffeeTaster:
    type: application
    platform: iOS
    sources:
      - CoffeeTaster
      - Shared
    dependencies:
      - package: CoffeeKit
      - target: CoffeeTasterWidgets
    info:
      path: CoffeeTaster/Info.plist
      properties:
        CFBundleDisplayName: Coffee Taster
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSMicrophoneUsageDescription: Coffee Taster listens when you tap the mic so you can describe a brew instead of typing.
        NSSpeechRecognitionUsageDescription: Your words are turned into text on your iPhone so the brew can be filled in.
        NSCameraUsageDescription: Take a photo of a coffee bag to fill in the bean details.
        NSSupportsLiveActivities: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).CoffeeTaster
        PRODUCT_NAME: CoffeeTaster
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  CoffeeTasterWidgets:
    type: app-extension
    platform: iOS
    sources:
      - CoffeeTasterWidgets
      - Shared
    info:
      path: CoffeeTasterWidgets/Info.plist
      properties:
        CFBundleDisplayName: Coffee Taster Timer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).CoffeeTaster.Widgets
        SKIP_INSTALL: YES
schemes:
  CoffeeTaster:
    build:
      targets:
        CoffeeTaster: all
    run:
      config: Debug
    archive:
      config: Release
